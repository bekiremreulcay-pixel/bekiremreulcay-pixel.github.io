html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--krem);color:var(--murekkep);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}

    var kalite = 0.85, blob = null;
    for (var n = 0; n < 6; n++) {
      blob = await new Promise(function (coz) { tuval.toBlob(coz, 'image/jpeg', kalite); });
      if (blob && blob.size <= 3.6 * 1024 * 1024) break;
      kalite -= 0.12;
    }
    if (!blob) throw new Error('Fotoğraf hazırlanamadı. Tekrar çekin.');
    return blob;
  }
  function blobB64(blob) {
    return new Promise(function (coz, red) {
      var fr = new FileReader();
      fr.onload = function () { var s = String(fr.result); coz(s.slice(s.indexOf(',') + 1)); };
      fr.onerror = function () { red(fr.error || new Error('okunamadı')); };
      fr.readAsDataURL(blob);
    });
  }

  /* 11 Eki'26 (Emre): ayrıntılı fiyat — günün gram fiyatı (Truncgil, CORS açık) × gram × milyem + işçilik = toplam */
  var FIYAT = { veri: null, zaman: 0, istek: null };
  function sayiTR(s) { var n = parseFloat(String(s || '').replace(/\./g, '').replace(',', '.')); return isNaN(n) ? null : n; }
  function gunFiyat() {
    if (FIYAT.veri && Date.now() - FIYAT.zaman < 30 * 60 * 1000) return Promise.resolve(FIYAT.veri);
    if (FIYAT.istek) return FIYAT.istek;
    FIYAT.istek = fetch('https://finans.truncgil.com/today.json', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var v = { has: sayiTR(j['gram-has-altin'] && j['gram-has-altin']['Satış']), gumus: sayiTR(j.gumus && j.gumus['Satış']), tarih: j.Update_Date || '' };
        FIYAT.veri = v; FIYAT.zaman = Date.now(); FIYAT.istek = null; return v;
      })
      .catch(function () { FIYAT.istek = null; return null; });
    return FIYAT.istek;
  }
  function madenOrani(i) {                                         // has fiyatına çarpan (milyem)
    var m = String(i.maden || '').toLocaleLowerCase('tr');
    if (m.indexOf('altın') >= 0 || m.indexOf('altin') >= 0) {
      var a = parseInt(String(i.ayar || ''), 10);
      var tablo = { 8: 0.333, 14: 0.585, 18: 0.750, 22: 0.916, 24: 0.995 };
      return a && tablo[a] ? { tur: 'altin', oran: tablo[a], ad: a + ' ayar altın' } : null;
    }
    if (m.indexOf('gümüş') >= 0 || m.indexOf('gumus') >= 0 || m.indexOf('925') >= 0) return { tur: 'gumus', oran: 0.925, ad: '925 gümüş' };
    return null;
  }

  function bittiSayfasi(i, duzelt) {
    var d = { blob: null, onizUrl: '', gonderiyor: false, hazirlaniyor: false };
    var oran = madenOrani(i), fiyat = null;
    var fiyatKutu = h('div', { class: 'not', style: 'display:none', 'aria-live': 'polite' });
    function fiyatCiz(g, u) {
      var birim = fiyat && oran ? (oran.tur === 'altin' ? fiyat.has : fiyat.gumus) : null;
      if (!birim) { fiyatKutu.style.display = 'none'; return; }
      var gr = g > 0 ? g : 0, iscilik = (u !== null && !isNaN(u) && u > 0) ? u : 0;
      var malzeme = gr * oran.oran * birim;
      fiyatKutu.textContent = '';
      fiyatKutu.appendChild(h('b', null, 'Ayrıntılı fiyat'));
      fiyatKutu.appendChild(document.createTextNode(
        '\nMalzeme (' + oran.ad + '): ' + sayiYaz(gr, 2) + ' g × ' + String(oran.oran).replace('.', ',') + ' × ' + paraYaz(birim) + ' TL = ' + paraYaz(malzeme) + ' TL' +
        '\nİşçilik: ' + paraYaz(iscilik) + ' TL' +
        '\nToplam: ' + paraYaz(malzeme + iscilik) + ' TL' +
        '\n(' + (oran.tur === 'altin' ? 'Has altın' : 'Gümüş') + ' gram fiyatı ' + paraYaz(birim) + ' TL · ' + fiyat.tarih + ')'));
      fiyatKutu.style.display = 'block';
    }
    var mevcutFoto = !!(duzelt && i.tarti_url);
    var girdiFoto = h('input', { type: 'file', accept: 'image/*', capture: 'environment', id: 'foto-girdi', class: 'gizli-girdi' });
    var fotoYazi = h('span', null, mevcutFoto ? 'Yeni fotoğraf çek (isteğe bağlı)' : 'Fotoğraf çek');
    var fotoEtiket = h('label', { class: 'btn btn-altin', for: 'foto-girdi' }, ikon('kamera', 28), fotoYazi);
    var onizImg = h('img', { alt: 'Çekilen tartı fotoğrafı' });
    var onizKutu = h('div', { class: 'onizleme', style: 'display:none' }, onizImg);
    var gramGirdi = h('input', { class: 'girdi', id: 'gram', type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: 'örn. 3,2', value: duzelt && i.gram != null ? String(i.gram).replace('.', ',') : '' });
    var okunan = h('small', null, '');
    var ucretGirdi = h('input', { class: 'girdi', id: 'ucret', type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: 'örn. 1000', value: duzelt && i.atolye_ucret != null ? String(i.atolye_ucret).replace('.', ',') : '' });
    var ucretOkunan = h('small', null, '');
    var hataKutu = h('div', { class: 'hata-kutu', style: 'display:none', role: 'alert' });
    var gonder = h('button', { class: 'btn btn-koyu', type: 'button', disabled: true }, 'Gönder');
    var vazgec = h('button', { class: 'btn btn-kontur', type: 'button' }, 'Vazgeç');
    var kapatDugme = h('button', { class: 'kapat-dugme', type: 'button', 'aria-label': 'Kapat' }, ikon('kapat', 26));

    var adetNotu = i.adet > 1
      ? h('div', { class: 'kural' }, 'Bu işte ' + i.adet + ' adet var. Hepsini birlikte tartıp TOPLAM gramı yazın.') : null;
    var sayfa = h('div', { class: 'sayfa', role: 'dialog', 'aria-label': 'Bitti' },
      h('div', { class: 'sayfa-ic' },
        h('div', { class: 'sayfa-ust' }, h('div', { class: 'baslik' }, i.is_no + ' · ' + i.urun), kapatDugme),
        h('div', { class: 'kural' }, 'Ürünü tartının üstüne düzgün koyun. Tartının ekranındaki gram okunsun. TEK fotoğraf çekin.'),
        adetNotu,
        h('div', { class: 'alan' }, girdiFoto, fotoEtiket, onizKutu),
        h('div', { class: 'alan' }, h('label', { for: 'gram' }, 'Tartıda yazan gram'), gramGirdi, okunan),
        h('div', { class: 'alan' }, h('label', { for: 'ucret' }, 'İşçilik ücreti (TL)'), ucretGirdi, ucretOkunan),
        fiyatKutu,
        hataKutu,
        h('div', { class: 'eylemler', style: 'margin-top:24px' }, gonder, vazgec)));
    document.body.appendChild(sayfa);
    var kaldir = katman([sayfa]);
    kaldir.sonra = function () { if (d.onizUrl) { URL.revokeObjectURL(d.onizUrl); d.onizUrl = ''; } };

    function hataYaz(m) { if (m) { hataKutu.textContent = m; hataKutu.style.display = 'block'; } else hataKutu.style.display = 'none'; }
    function dogrula() {
      var g = gramCoz(gramGirdi.value), u = tlCoz(ucretGirdi.value);
      okunan.textContent = gramGirdi.value.trim() === '' ? '' : (g > 0 ? 'Okunan değer: ' + sayiYaz(g, 2) + ' g' : 'Sayı yazın (ör. 3,2)');
      ucretOkunan.textContent = ucretGirdi.value.trim() === '' ? '' : (u === null || isNaN(u) ? 'Sayı yazın (ör. 1000)' : 'Okunan değer: ' + paraYaz(u) + ' TL');
      var fotoTamam = !!d.blob || mevcutFoto;
      gonder.disabled = d.gonderiyor || d.hazirlaniyor || !(g > 0) || u === null || isNaN(u) || !(u > 0) || !fotoTamam;   // 11 Eki'26 Emre: işçilik ücreti ZORUNLU
      fiyatCiz(g, u);
    }
    girdiFoto.addEventListener('change', async function () {
      var f = girdiFoto.files && girdiFoto.files[0];
      if (!f) return;
      d.hazirlaniyor = true; hataYaz(''); fotoYazi.textContent = 'Fotoğraf hazırlanıyor…'; dogrula();
      try {
        d.blob = await kucult(f);
        if (d.onizUrl) URL.revokeObjectURL(d.onizUrl);
        d.onizUrl = URL.createObjectURL(d.blob); onizImg.src = d.onizUrl; onizKutu.style.display = 'block';
        fotoYazi.textContent = 'Fotoğrafı değiştir';
      } catch (e) {
        d.blob = null; onizKutu.style.display = 'none'; fotoYazi.textContent = mevcutFoto ? 'Yeni fotoğraf çek (isteğe bağlı)' : 'Fotoğraf çek';
        hataYaz(e && e.message ? e.message : 'Fotoğraf okunamadı. Tekrar çekin.');
      }
      d.hazirlaniyor = false; girdiFoto.value = ''; dogrula();
    });
    gramGirdi.addEventListener('input', dogrula);
    ucretGirdi.addEventListener('input', dogrula);
    vazgec.addEventListener('click', function () { if (!d.gonderiyor) kaldir.kapat(); });
    kapatDugme.addEventListener('click', function () { if (!d.gonderiyor) kaldir.kapat(); });
    gonder.addEventListener('click', async function () {
      if (d.gonderiyor) return;
      var g = gramCoz(gramGirdi.value), u = tlCoz(ucretGirdi.value);
      if (!(g > 0)) { hataYaz('Tartıda yazan gramı yazın (ör. 3,2).'); return; }
      if (u === null || isNaN(u) || !(u > 0)) { hataYaz('İşçilik ücretini yazın (ör. 1000). Bu alan zorunlu.'); return; }
      if (!d.blob && !mevcutFoto) { hataYaz('Tartı fotoğrafı zorunlu. Önce fotoğraf çekin.'); return; }
      if (g >= 50 && !window.confirm('Gram ' + sayiYaz(g, 2) + ' g görünüyor. Doğru mu?')) return;
      d.gonderiyor = true; hataYaz(''); gonder.disabled = true; gonder.textContent = 'Gönderiliyor…'; vazgec.disabled = true;
      var govde = { oturum: S.oturum, is_id: i.id, gram: g };
      govde.ucret = u;
      try { if (d.blob) govde.foto_base64 = await blobB64(d.blob); } catch (e) { d.gonderiyor = false; vazgec.disabled = false; gonder.textContent = 'Gönder'; hataYaz('Fotoğraf okunamadı. Tekrar çekin.'); dogrula(); return; }
      var r = await api('bitti', govde, 120000);
      d.gonderiyor = false; vazgec.disabled = false; gonder.textContent = 'Gönder';
      if (r.ok) {
        kaldir.kapat();
        S.sekme = 'biten'; sekmeCiz();
        bildir(duzelt ? 'Düzeltme kaydedildi.' : 'Kaydedildi. Eline sağlık!', 'basari');
        await yukle(false); window.scrollTo(0, 0);
      } else if (r.kod === 'oturum') {
        oturumuBirak(r.hata);
      } else {
        hataYaz(r.hata || 'Gönderilemedi. Tekrar deneyin.'); dogrula();
      }
    });
    dogrula();
  }

  basla();
})();
</script>
